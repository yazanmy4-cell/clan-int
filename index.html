<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAZHINI Bot — Squad Generator</title>
<style>
  :root {
    --bg: #0a0a12; --panel: #11121c; --panel-2: #181a28; --border: #262a40;
    --text: #e6e8f2; --muted: #7b819c;
    --cyan: #00f0ff; --magenta: #ff2e88; --yellow: #ffd60a;
    --green: #39ff88; --red: #ff4d5e;
  }
  [data-theme="lite"] {
    --bg: #f4f6fb; --panel: #ffffff; --panel-2: #eef1f8; --border: #d7dced;
    --text: #1a1d29; --muted: #6b7291;
    --cyan: #0090aa; --magenta: #d81b6a; --yellow: #b8860b;
    --green: #1e9e57; --red: #d13244;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; min-height: 100vh;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px; padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, var(--bg), var(--panel-2));
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--cyan); }
  .brand span { color: var(--magenta); }
  .uptime { color: var(--muted); font-size: 13px; }
  .status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); margin-right: 6px;
  }
  .status-dot.offline { background: var(--red); }
  main { padding: 18px 22px; display: grid; gap: 18px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px;
  }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .stat.cyan .value { color: var(--cyan); }
  .stat.magenta .value { color: var(--magenta); }
  .stat.yellow .value { color: var(--yellow); }
  .stat.green .value { color: var(--green); }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel-2);
  }
  .panel-head h2 { margin: 0; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  button {
    background: transparent; color: var(--cyan); border: 1px solid var(--cyan);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  button:hover { background: var(--cyan); color: var(--bg); }
  button.magenta { color: var(--magenta); border-color: var(--magenta); }
  button.magenta:hover { background: var(--magenta); color: var(--bg); }
  button.yellow { color: var(--yellow); border-color: var(--yellow); }
  button.yellow:hover { background: var(--yellow); color: var(--bg); }
  button.danger { color: var(--red); border-color: var(--red); }
  button.danger:hover { background: var(--red); color: var(--bg); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  td.num { text-align: right; }
  .mono { font-family: Consolas, monospace; color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; border: 1px solid currentColor;
  }
  .pill.online { color: var(--green); }
  .pill.paused { color: var(--yellow); }
  .pill.error  { color: var(--red); }
  .bar { width: 110px; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; border: 1px solid var(--border); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { padding: 4px 8px; font-size: 11px; }
  .empty { padding: 26px; text-align: center; color: var(--muted); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1.3fr; gap: 18px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  form.add { padding: 14px; display: grid; gap: 10px; }
  input, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 9px 11px; font-size: 13px; outline: none;
  }
  input:focus, select:focus { border-color: var(--cyan); }
  .msg { font-size: 12px; min-height: 16px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }
  .logs {
    height: 340px; overflow-y: auto; padding: 10px 14px;
    font-family: Consolas, monospace; font-size: 12px; line-height: 1.6;
    background: var(--panel-2);
  }
  .log { white-space: pre-wrap; word-break: break-word; }
  .log .t { color: var(--muted); margin-right: 8px; }
  .log.success { color: var(--green); }
  .log.warning { color: var(--yellow); }
  .log.error { color: var(--red); }

  /* Login overlay */
  #login-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  .login-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 26px; width: 340px; max-width: 92vw;
  }
  .login-card h1 { margin: 0 0 14px; font-size: 18px; color: var(--cyan); letter-spacing: 2px; }
  .login-card .hint { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .login-card label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .login-card .row { margin-bottom: 10px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-card">
    <h1>TAZHINI <span style="color:var(--magenta)">//</span> BOT</h1>
    <div class="hint">Login required</div>
    <div class="row"><label>Username</label><input id="login-user" autocomplete="username" placeholder="admin"></div>
    <div class="row"><label>Password</label><input id="login-pass" type="password" autocomplete="current-password" placeholder="admin"></div>
    <div class="row"><button id="login-btn" style="width:100%">Sign In</button></div>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header>
  <div>
    <div class="brand">TAZHINI <span>//</span> BOT</div>
    <div class="uptime">
      <span class="status-dot" id="conn-dot"></span><span id="conn-text">Connecting...</span>
      &nbsp;|&nbsp; Uptime <span id="uptime">0s</span>
    </div>
  </div>
  <div class="actions">
    <button class="yellow" id="btn-theme">Lite Mode</button>
    <button class="magenta" id="btn-clear-logs">Clear Logs</button>
    <button class="danger" id="btn-logout">Logout</button>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat cyan"><div class="label">Accounts</div><div class="value" id="s-accounts">0</div></div>
    <div class="stat magenta"><div class="label">Matches Finished</div><div class="value" id="s-matches">0</div></div>
    <div class="stat yellow"><div class="label">Active Matches</div><div class="value" id="s-active">0</div></div>
    <div class="stat green"><div class="label">Total EXP</div><div class="value" id="s-exp">0</div></div>
  </section>

  <section class="grid-2">
    <!-- SQUAD GENERATOR -->
    <div class="panel">
      <div class="panel-head"><h2>🎯 Squad Generator</h2></div>
      <form class="add" id="gen-form">
        <div>
          <label style="font-size:12px;color:var(--muted)">Account Name</label>
          <input id="gen-name" placeholder="yazan" autocomplete="off">
        </div>
        <div>
          <label style="font-size:12px;color:var(--muted)">Region</label>
          <select id="gen-region">
            <option value="ME">ME</option>
            <option value="IND">IND</option>
            <option value="BD">BD</option>
            <option value="PK">PK</option>
            <option value="ID">ID</option>
            <option value="SG">SG</option>
            <option value="BR">BR</option>
            <option value="US">US</option>
            <option value="EU">EU</option>
            <option value="VN">VN</option>
            <option value="TH">TH</option>
            <option value="TW">TW</option>
            <option value="CIS">CIS</option>
            <option value="SAC">SAC</option>
            <option value="LK">LK</option>
          </select>
        </div>
        <div>
          <label style="font-size:12px;color:var(--muted)">Squads (each = 4 accs)</label>
          <input id="gen-squads" type="number" min="1" max="10" value="1">
        </div>
        <div><button type="submit" id="gen-btn">Generate</button></div>
        <div class="msg" id="gen-msg"></div>
        <div id="gen-job" class="mono" style="font-size:12px;"></div>
      </form>
    </div>

    <!-- CLAN BUTTON -->
    <div class="panel">
      <div class="panel-head"><h2>🛡️ Clan Join Requests</h2></div>
      <form class="add" id="clan-form">
        <div>
          <label style="font-size:12px;color:var(--muted)">Clan ID</label>
          <input id="clan-id" placeholder="3086674226" autocomplete="off">
        </div>
        <div><button type="submit" class="magenta" id="clan-btn">Send Join Requests</button></div>
        <div class="msg" id="clan-msg"></div>
        <div id="clan-job" class="mono" style="font-size:12px;"></div>
      </form>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Accounts</h2>
      <span class="uptime" id="acc-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nickname</th><th>UID</th><th>Region</th><th>Level</th>
            <th>Progress</th><th class="num">Gained</th><th class="num">Matches</th>
            <th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="acc-body">
          <tr><td colspan="9" class="empty">Waiting for data...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Live Log</h2><span class="uptime" id="log-count"></span></div>
    <div class="logs" id="logs"></div>
  </section>
</main>
</div>

<script>
(function(){
  const POLL_MS = 2000;
  const $ = id => document.getElementById(id);
  const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmt = n => Number(n || 0).toLocaleString();
  const fmtDur = s => {
    s = Math.max(0, Math.floor(s||0));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60;
    if (h) return `${h}h ${m}m`; if (m) return `${m}m ${ss}s`; return `${ss}s`;
  };

  // ─── THEME ───
  const savedTheme = localStorage.getItem("tazhini_theme") || "dark";
  document.documentElement.setAttribute("data-theme", savedTheme);
  $("btn-theme").textContent = savedTheme === "dark" ? "Lite Mode" : "Dark Mode";
  $("btn-theme").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme");
    const nxt = cur === "dark" ? "lite" : "dark";
    document.documentElement.setAttribute("data-theme", nxt);
    localStorage.setItem("tazhini_theme", nxt);
    $("btn-theme").textContent = nxt === "dark" ? "Lite Mode" : "Dark Mode";
  };

  // ─── AUTH ───
  let token = localStorage.getItem("tazhini_token") || "";

  async function api(path, opts = {}) {
    const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    if (token) headers["Authorization"] = "Bearer " + token;
    const res = await fetch(path, Object.assign({}, opts, { headers }));
    if (res.status === 401) { logout(); throw new Error("unauthorized"); }
    return await res.json();
  }

  function logout() {
    token = "";
    localStorage.removeItem("tazhini_token");
    $("app").classList.add("hidden");
    $("login-overlay").classList.remove("hidden");
  }

  $("btn-logout").onclick = logout;

  $("login-btn").onclick = async () => {
    const u = $("login-user").value.trim(), p = $("login-pass").value.trim();
    const msg = $("login-msg");
    msg.textContent = "";
    try {
      const r = await fetch("/api/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p }),
      });
      const d = await r.json();
      if (d.status === "ok") {
        token = d.token;
        localStorage.setItem("tazhini_token", token);
        $("login-overlay").classList.add("hidden");
        $("app").classList.remove("hidden");
        poll();
      } else {
        msg.textContent = d.error || "Login failed";
        msg.className = "msg err";
      }
    } catch (e) { msg.textContent = e.message; msg.className = "msg err"; }
  };

  // auto-login if token
  if (token) {
    $("login-overlay").classList.add("hidden");
    $("app").classList.remove("hidden");
  }

  // ─── RENDER ───
  function renderStats(d) {
    $("s-accounts").textContent = fmt(d.total_accounts);
    $("s-matches").textContent = fmt(d.total_matches);
    $("s-active").textContent = fmt(d.total_active_matches);
    $("s-exp").textContent = fmt(d.total_gained_exp);
    $("uptime").textContent = fmtDur(d.uptime);
    $("acc-count").textContent = `${fmt(d.total_accounts)} total`;
  }

  function renderAccounts(list) {
    const body = $("acc-body");
    if (!list.length) {
      body.innerHTML = `<tr><td colspan="9" class="empty">No accounts. Use Squad Generator.</td></tr>`;
      return;
    }
    body.innerHTML = list.map(a => {
      const paused = !!a.is_paused;
      const pct = Math.min(100, Math.max(0, Number(a.progress_pct) || 0));
      return `
        <tr data-uid="${esc(a.uid)}">
          <td>${esc(a.nickname)}</td>
          <td class="mono">${esc(a.uid)}</td>
          <td>${esc(a.region)}</td>
          <td>Lv ${esc(a.level)}</td>
          <td><span class="bar"><i style="width:${pct}%"></i></span> <span class="mono">${pct}%</span></td>
          <td class="num">+${fmt(a.gained_exp)}</td>
          <td class="num">${fmt(a.matches_played)}</td>
          <td><span class="pill ${paused ? "paused" : "online"}">${paused ? "PAUSED" : "ONLINE"}</span></td>
          <td>
            <div class="actions">
              <button class="yellow" data-act="pause">${paused ? "Resume" : "Pause"}</button>
            </div>
          </td>
        </tr>`;
    }).join("");
  }

  function renderLogs(logs) {
    const box = $("logs");
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    box.innerHTML = logs.map(l => `<div class="log ${esc(l.level)}"><span class="t">${esc(l.time)}</span>${esc(l.message)}</div>`).join("")
      || `<div class="log">No log entries.</div>`;
    $("log-count").textContent = `${logs.length} entries`;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  let accountsById = {};

  async function poll() {
    if (!token) return;
    try {
      const d = await api("/api/stats");
      $("conn-dot").classList.remove("offline");
      $("conn-text").textContent = "Live";
      renderStats(d);
      const accs = d.accounts || [];
      accountsById = {};
      accs.forEach(a => accountsById[a.uid] = a);
      renderAccounts(accs);
      renderLogs(d.logs || []);
    } catch (e) {
      $("conn-dot").classList.add("offline");
      $("conn-text").textContent = "Disconnected";
    }
  }

  // ─── ACTIONS ───
  $("acc-body").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const uid = btn.closest("tr").dataset.uid;
    const act = btn.dataset.act;
    if (act === "pause") await api("/api/account/pause", { method: "POST", body: JSON.stringify({ uid }) });
    poll();
  });

  $("btn-clear-logs").onclick = async () => { await api("/api/logs/clear", { method: "POST" }); poll(); };

  // ─── GEN ───
  $("gen-form").onsubmit = async (ev) => {
    ev.preventDefault();
    const msg = $("gen-msg"), jobEl = $("gen-job"), btn = $("gen-btn");
    msg.textContent = ""; jobEl.textContent = "";
    const name = $("gen-name").value.trim() || "squad";
    const region = $("gen-region").value;
    const squads = parseInt($("gen-squads").value || "1", 10);
    btn.disabled = true;
    try {
      const r = await api("/api/gen_squad", {
        method: "POST",
        body: JSON.stringify({ name, region, squads }),
      });
      if (r.status !== "ok") throw new Error(r.error || "failed");
      msg.textContent = `Job ${r.job_id} started...`;
      msg.className = "msg ok";
      trackJob(r.job_id, "gen");
    } catch (e) {
      msg.textContent = e.message; msg.className = "msg err";
    } finally { btn.disabled = false; }
  };

  // ─── CLAN ───
  $("clan-form").onsubmit = async (ev) => {
    ev.preventDefault();
    const msg = $("clan-msg"), jobEl = $("clan-job"), btn = $("clan-btn");
    msg.textContent = ""; jobEl.textContent = "";
    const clan_id = $("clan-id").value.trim();
    if (!/^\d+$/.test(clan_id)) { msg.textContent = "Clan ID must be numeric"; msg.className = "msg err"; return; }
    btn.disabled = true;
    try {
      const r = await api("/api/clan/send_requests", {
        method: "POST",
        body: JSON.stringify({ clan_id: parseInt(clan_id, 10) }),
      });
      if (r.status !== "ok") throw new Error(r.error || "failed");
      msg.textContent = `Job ${r.job_id} started...`;
      msg.className = "msg ok";
      trackJob(r.job_id, "clan");
    } catch (e) {
      msg.textContent = e.message; msg.className = "msg err";
    } finally { btn.disabled = false; }
  };

  async function trackJob(jobId, kind) {
    const el = kind === "gen" ? $("gen-job") : $("clan-job");
    for (let i = 0; i < 600; i++) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        const j = await api("/api/job/" + jobId);
        if (kind === "gen") {
          el.textContent = `[${j.status}] got ${(j.accounts||[]).length}/${j.requested} | picked ${(j.picked||[]).length}/${j.needed}`
            + (j.error ? ` | err: ${j.error}` : "");
        } else {
          const ok = (j.results||[]).filter(r => r.ok).length;
          el.textContent = `[${j.status}] ${ok}/${(j.results||[]).length} ok`
            + (j.error ? ` | err: ${j.error}` : "");
        }
        if (j.status === "done" || j.status === "error") break;
      } catch (e) { el.textContent = "poll error: " + e.message; break; }
    }
    poll();
  }

  // start
  if (token) poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
