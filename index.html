<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TAZHINI Bot Dashboard</title>
<style>
  :root {
    --bg: #0a0a12;
    --panel: #11121c;
    --panel-2: #181a28;
    --border: #262a40;
    --text: #e6e8f2;
    --muted: #7b819c;
    --cyan: #00f0ff;
    --magenta: #ff2e88;
    --yellow: #ffd60a;
    --green: #39ff88;
    --red: #ff4d5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, #0a0a12, #14102a);
  }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--cyan); text-shadow: 0 0 12px rgba(0,240,255,.5); }
  .brand span { color: var(--magenta); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); margin-right: 6px; }
  .status-dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .uptime { color: var(--muted); font-size: 13px; }
  main { padding: 20px 24px; display: grid; gap: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat.cyan .value { color: var(--cyan); }
  .stat.magenta .value { color: var(--magenta); }
  .stat.yellow .value { color: var(--yellow); }
  .stat.green .value { color: var(--green); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; }

  button {
    background: transparent;
    color: var(--cyan);
    border: 1px solid var(--cyan);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  button:hover { background: var(--cyan); color: #000; }
  button.magenta { color: var(--magenta); border-color: var(--magenta); }
  button.magenta:hover { background: var(--magenta); color: #000; }
  button.yellow { color: var(--yellow); border-color: var(--yellow); }
  button.yellow:hover { background: var(--yellow); color: #000; }
  button.danger { color: var(--red); border-color: var(--red); }
  button.danger:hover { background: var(--red); color: #000; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  tr:hover td { background: rgba(0,240,255,.03); }
  .nick { font-weight: 600; }
  .mono { font-family: Consolas, "Courier New", monospace; color: var(--muted); font-size: 12px; }
  .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .5px;
    border: 1px solid currentColor;
  }
  .pill.online { color: var(--green); }
  .pill.paused { color: var(--yellow); }
  .pill.br { color: var(--cyan); }
  .pill.lone { color: var(--magenta); }
  .bar { width: 120px; height: 8px; background: #0d0e18; border-radius: 4px; overflow: hidden; border: 1px solid var(--border); display: inline-block; vertical-align: middle; }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions button { padding: 4px 8px; font-size: 11px; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

  form.add { padding: 16px; display: grid; gap: 10px; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { border-color: var(--border); color: var(--muted); }
  .tabs button.active { border-color: var(--magenta); color: var(--magenta); }
  input {
    width: 100%;
    background: #0d0e18;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 9px 11px;
    font-size: 13px;
    outline: none;
  }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(0,240,255,.15); }
  .msg { font-size: 12px; min-height: 16px; }
  .msg.ok { color: var(--green); }
  .msg.err { color: var(--red); }

  .logs {
    height: 380px;
    overflow-y: auto;
    padding: 10px 14px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px;
    line-height: 1.6;
    background: #080910;
  }
  .log { white-space: pre-wrap; word-break: break-word; }
  .log .t { color: var(--muted); margin-right: 8px; }
  .log.info { color: var(--text); }
  .log.success { color: var(--green); }
  .log.warning { color: var(--yellow); }
  .log.error { color: var(--red); }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">TAZHINI <span>//</span> BOT</div>
    <div class="uptime"><span class="status-dot" id="conn-dot"></span><span id="conn-text">Connecting...</span> &nbsp;|&nbsp; Uptime <span id="uptime">0s</span></div>
  </div>
  <div class="actions">
    <button class="yellow" id="btn-pause-all">Pause / Resume All</button>
    <button class="magenta" id="btn-clear-logs">Clear Logs</button>
  </div>
</header>

<main>
  <section class="stats">
    <div class="stat cyan"><div class="label">Accounts</div><div class="value" id="s-accounts">0</div></div>
    <div class="stat magenta"><div class="label">Matches Finished</div><div class="value" id="s-matches">0</div></div>
    <div class="stat yellow"><div class="label">Matches Started</div><div class="value" id="s-started">0</div></div>
    <div class="stat cyan"><div class="label">Active Matches</div><div class="value" id="s-active">0</div></div>
    <div class="stat green"><div class="label">Total EXP Gained</div><div class="value" id="s-exp">0</div></div>
    <div class="stat magenta"><div class="label">EXP / Hour</div><div class="value" id="s-exp-hr">0</div></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Accounts</h2>
      <span class="uptime" id="acc-count"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nickname</th>
            <th>UID</th>
            <th>Region</th>
            <th>Level</th>
            <th>Mode</th>
            <th>Progress</th>
            <th class="num">Gained EXP</th>
            <th class="num">Remaining</th>
            <th class="num">Matches</th>
            <th>Uptime</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="acc-body">
          <tr><td colspan="12" class="empty">Waiting for data...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="grid-2">
    <div class="panel">
      <div class="panel-head">
        <h2>Add Account</h2>
        <div class="tabs">
          <button id="tab-cred" class="active">UID + Password</button>
          <button id="tab-token">Token</button>
        </div>
      </div>
      <form class="add" id="add-form">
        <div id="fields-cred" style="display:grid;gap:10px;">
          <input id="in-uid" placeholder="UID" autocomplete="off">
          <input id="in-pwd" type="password" placeholder="Password" autocomplete="new-password">
        </div>
        <div id="fields-token" style="display:none;">
          <input id="in-token" placeholder="Access token" autocomplete="off">
        </div>
        <div>
          <button type="submit" id="btn-add">Add to Rotation</button>
        </div>
        <div class="msg" id="add-msg"></div>
      </form>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h2>Live Log</h2>
        <span class="uptime" id="log-count"></span>
      </div>
      <div class="logs" id="logs"></div>
    </div>
  </section>
</main>

<script>
(function () {
  const POLL_MS = 2000;
  const $ = (id) => document.getElementById(id);

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  const fmt = (n) => Number(n || 0).toLocaleString();

  function fmtDuration(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h) return `${h}h ${m}m`;
    if (m) return `${m}m ${s}s`;
    return `${s}s`;
  }

  async function post(url, body) {
    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {})
      });
      return await res.json();
    } catch (e) {
      return { status: "error", error: e.message };
    }
  }

  function renderStats(d) {
    $("s-accounts").textContent = fmt(d.total_accounts);
    $("s-matches").textContent = fmt(d.total_matches);
    $("s-started").textContent = fmt(d.total_matches_started);
    $("s-active").textContent = fmt(d.total_active_matches);
    $("s-exp").textContent = fmt(d.total_gained_exp);
    $("s-exp-hr").textContent = fmt(d.exp_per_hour);
    $("uptime").textContent = fmtDuration(d.uptime);
    $("acc-count").textContent = `${fmt(d.total_accounts)} total`;
  }

  function renderAccounts(list) {
    const body = $("acc-body");
    if (!list.length) {
      body.innerHTML = `<tr><td colspan="12" class="empty">No accounts in rotation. Add one below.</td></tr>`;
      return;
    }
    body.innerHTML = list.map((a) => {
      const paused = !!a.is_paused;
      const lone = a.mode === "LONE_WOLF";
      const pct = Math.min(100, Math.max(0, Number(a.progress_pct) || 0));
      const statusCls = paused ? "paused" : "online";
      const statusTxt = paused ? "PAUSED" : (a.status || "ONLINE");
      const uid = esc(a.uid);
      return `
        <tr data-uid="${uid}">
          <td class="nick">${esc(a.nickname)}</td>
          <td class="mono">${uid}</td>
          <td>${esc(a.region)}</td>
          <td>Lv ${esc(a.level)} &rarr; ${esc(a.next_level)}</td>
          <td><span class="pill ${lone ? "lone" : "br"}">${lone ? "LONE WOLF" : "BR"}</span></td>
          <td>
            <span class="bar"><i style="width:${pct}%"></i></span>
            <span class="mono">${pct}%</span>
          </td>
          <td class="num">+${fmt(a.gained_exp)}</td>
          <td class="num">${fmt(a.remaining_exp)}</td>
          <td class="num">${fmt(a.matches_played)} <span class="mono">(${fmt(a.active_matches)} live)</span></td>
          <td class="mono">${fmtDuration(a.uptime_seconds)}</td>
          <td><span class="pill ${statusCls}">${esc(statusTxt)}</span></td>
          <td>
            <div class="actions">
              <button class="yellow" data-act="pause">${paused ? "Resume" : "Pause"}</button>
              <button data-act="refresh">Refresh</button>
              <button data-act="restart">Restart</button>
              <button class="danger" data-act="delete">Delete</button>
            </div>
          </td>
        </tr>`;
    }).join("");
  }

  function renderLogs(logs) {
    const box = $("logs");
    const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
    box.innerHTML = logs.map((l) => `
      <div class="log ${esc(l.level)}"><span class="t">${esc(l.time)}</span>${esc(l.message)}</div>
    `).join("") || `<div class="log info">No log entries.</div>`;
    $("log-count").textContent = `${logs.length} entries`;
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  let accountsById = {};

  async function poll() {
    try {
      const res = await fetch("/api/stats", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      $("conn-dot").classList.remove("offline");
      $("conn-text").textContent = "Live";
      renderStats(d);
      const accounts = d.accounts || [];
      accountsById = {};
      accounts.forEach((a) => { accountsById[a.uid] = a; });
      renderAccounts(accounts);
      renderLogs(d.logs || []);
    } catch (e) {
      $("conn-dot").classList.add("offline");
      $("conn-text").textContent = "Disconnected";
    }
  }

  // Row actions (event delegation)
  $("acc-body").addEventListener("click", async (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const uid = btn.closest("tr").dataset.uid;
    const act = btn.dataset.act;
    const acc = accountsById[uid] || {};

    if (act === "delete") {
      if (!confirm(`Delete account ${acc.nickname || uid} (${uid}) from the system?`)) return;
      await post("/api/account/delete", { uid, auth_uid: acc.auth_uid || "" });
    } else if (act === "pause") {
      await post("/api/account/pause", { uid });
    } else if (act === "refresh") {
      await post("/api/account/refresh", { uid });
    } else if (act === "restart") {
      await post("/api/account/restart", { uid });
    }
    poll();
  });

  $("btn-pause-all").addEventListener("click", async () => {
    await post("/api/account/pause_all");
    poll();
  });

  $("btn-clear-logs").addEventListener("click", async () => {
    await post("/api/logs/clear");
    poll();
  });

  // Add-account tabs
  let mode = "cred";
  function setMode(m) {
    mode = m;
    $("tab-cred").classList.toggle("active", m === "cred");
    $("tab-token").classList.toggle("active", m === "token");
    $("fields-cred").style.display = m === "cred" ? "grid" : "none";
    $("fields-token").style.display = m === "token" ? "block" : "none";
    $("add-msg").textContent = "";
  }
  $("tab-cred").addEventListener("click", () => setMode("cred"));
  $("tab-token").addEventListener("click", () => setMode("token"));

  $("add-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const msg = $("add-msg");
    const btn = $("btn-add");
    let payload;
    if (mode === "cred") {
      const uid = $("in-uid").value.trim();
      const password = $("in-pwd").value.trim();
      if (!uid || !password) return showMsg("UID and password are required.", false);
      payload = { uid, password };
    } else {
      const token = $("in-token").value.trim();
      if (!token) return showMsg("Token is required.", false);
      payload = { token };
    }

    btn.disabled = true;
    const r = await post("/api/account/add", payload);
    btn.disabled = false;

    if (r.status === "ok") {
      showMsg("Account added to rotation.", true);
      $("in-uid").value = "";
      $("in-pwd").value = "";
      $("in-token").value = "";
      poll();
    } else {
      showMsg(r.error || "Failed to add account.", false);
    }

    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = "msg " + (ok ? "ok" : "err");
    }
  });

  poll();
  setInterval(poll, POLL_MS);
})();
</script>
</body>
</html>
